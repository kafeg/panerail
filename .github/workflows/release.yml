name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The version's last component is the commit count.
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      # Signing and notarisation switch themselves on once the secrets exist.
      # Without them the build still produces a usable, ad-hoc signed app that
      # Gatekeeper will question on first launch.
      - name: Check for signing credentials
        id: creds
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          if [ -n "$CERTIFICATE" ] && [ -n "$API_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets absent — producing an ad-hoc signed build."
          fi

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: |
          xcodebuild \
            -project PaneRail.xcodeproj \
            -scheme PaneRail \
            -configuration Debug \
            -derivedDataPath build \
            test

      - name: Import Developer ID certificate
        if: steps.creds.outputs.signed == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a UI prompt that nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build Release
        env:
          SIGNED: ${{ steps.creds.outputs.signed }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            IDENTITY="Developer ID Application"
          else
            IDENTITY="-"
          fi

          xcodebuild \
            -project PaneRail.xcodeproj \
            -scheme PaneRail \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

      # The built app is the single source of truth: its version was stamped
      # from the commit count during the build.
      - name: Read the built version
        id: version
        run: |
          PLIST=build/Build/Products/Release/PaneRail.app/Contents/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::warning::Tag $GITHUB_REF_NAME does not match the built version $VERSION"
          fi

      - name: Notarise and staple
        if: steps.creds.outputs.signed == 'true'
        env:
          API_KEY: ${{ secrets.NOTARY_API_KEY }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          APP=build/Build/Products/Release/PaneRail.app
          codesign --verify --strict --verbose=2 "$APP"

          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarise.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait

          # Stapling puts the ticket inside the app, so a first launch works
          # even when the machine is offline.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/PaneRail.app \
            "dist/PaneRail-${{ steps.version.outputs.version }}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.creds.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            NOTE=""
          else
            NOTE=$'\n\n---\nThis build is not notarised. On first launch macOS will block it: open System Settings › Privacy & Security, find the message naming PaneRail and click Open Anyway.'
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "PaneRail ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes "$NOTE" \
            dist/*.zip
